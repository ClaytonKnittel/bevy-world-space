[package]
name = "bevy-world-space"
version = "0.1.0"
edition = "2024"

[features]
gridlines = []

[dependencies]
bevy = { version = "0.15.3", default-features = false, features = ["bevy_core_pipeline", "bevy_window"] }
ordered-float = "5.0.0"

[dev-dependencies]
bevy = { version = "0.15.3", default-features = false, features = ["bevy_window", "bevy_winit", "bevy_render", "x11", "bevy_gizmos"] }
